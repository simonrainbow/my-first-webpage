<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 27</title>
    <style>
        /* 基礎設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* 頂部 Header */
        .header {
            background-color: #d1e7dd; /* 淺綠色 */
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #999;
            font-weight: bold;
        }

        /* 中間三欄的容器 */
        .row {
            display: flex;
            flex-wrap: wrap; /* 讓內容在空間不足時自動換行 */
            gap: 10px;      /* 方塊之間的間距 */
            margin-bottom: 20px;
        }

        
        .column {
            background-color: #00bcd4; 
            color: white;
            padding: 50px 0;
            border: 1px solid #555;
            flex: 1; 
            min-width: 0;
        }

        
        .footer-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-col {
            background-color: #eee;
            border: 1px solid #ccc;
            padding: 20px;
            flex: 1; 
        }

        

        
        @media screen and (max-width: 480px) {
    .row {
        flex-direction: column;
    }

    .column {
        flex: none;
        width: 100%;
    }

    .footer-row {
        flex-direction: column; 
    }

    .footer-col {
        flex: none;
        width: 100%; 
    }
    }
    </style>
</head>
<body>

    <div class="header">Header</div>

    <div class="row">
        <div class="column">Content 1</div>
        <div class="column">Content 2</div>
        <div class="column">Content 3</div>
    </div>

    <div class="footer-row">
        <div class="footer-col">Footer 1</div>
        <div class="footer-col">Footer 2</div>
        <div class="footer-col">Footer 3</div>
        <div class="footer-col">Footer 4</div>
    </div>

</body>
</html>
